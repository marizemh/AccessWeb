<form (ngSubmit)="onSubmit()" #accessRequestForm="ngForm">
    <div>
        <label for="email">Correo:</label>
        <input type="email" id="email" name="email" [value]="associatedEmail" readonly />
    </div>
    <div>
        <label for="application">Aplicación:</label>
        <select id="application" name="application" ngModel (change)="onApplicationChange($event.target.value)" required>
            <option value="">Seleccione una aplicación</option>
            <option *ngFor="let app of applications" [value]="app.name">{{ app.name }}</option>
        </select>
    </div>
    <div>
        <label for="environment">Ambiente:</label>
        <select id="environment" name="environment" [(ngModel)]="selectedEnvironment" required>
            <option value="">Seleccione un ambiente</option>
            <option *ngFor="let env of environments" [value]="env">{{ env }}</option>
        </select>
    </div>
    <div *ngIf="approvers.length">
        <p>Aprobadores:</p>
        <ul>
            <li *ngFor="let approver of approvers">{{ approver }}</li>
        </ul>
    </div>
    <div>
        <label for="duration">Duración:</label>
        <select id="duration" name="duration" [(ngModel)]="selectedDuration" required>
            <option *ngFor="let option of durationOptions" [value]="option.value">{{ option.label }}</option>
        </select>
    </div>
    <button type="submit">Enviar Solicitud</button>
    <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div>
</form>
